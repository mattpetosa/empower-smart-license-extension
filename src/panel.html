<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empower Smart License Extension</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="masthead">
  <img id="logo" src="../icons/logo.svg" alt="" width="32" height="32">
  <div><h1>Empower Smart License Extension</h1><p class="sub">Salesforce Assets → Licensing Portal CSV</p></div>
</header>
<main>
  <section>
    <button id="read" class="primary">Read assets from this page</button>
    <p id="error" class="msg error" hidden></p>
    <p id="warning" class="msg warning" hidden></p>
  </section>
  <section id="review" hidden>
    <h2>Assets <span id="assetcount" class="muted"></span></h2>
    <div id="envs" hidden><h3 id="envtitle"></h3><div class="envs"></div></div>
    <p id="unassigned" class="msg warning" hidden></p>
    <div id="likely"><h3>Likely licenses</h3><ul class="checklist"></ul></div>
    <details id="otherbox"><summary>Other assets (<span id="othercount">0</span>)</summary><ul class="checklist"></ul></details>

    <h2>Details</h2>
    <div class="fields">
      <label>Company <input id="company" autocomplete="off"></label>
      <label id="support_id_row">Support Plan ID <input id="support_id" autocomplete="off"></label>
      <label>Order Number <input id="order_number" autocomplete="off"></label>
      <label>Sold To <input id="sold_to" autocomplete="off"></label>
    </div>
    <label class="opt"><input type="checkbox" id="remove_sqt"> Remove SQTs <span class="muted">(any license with "SQT" in its name)</span></label>
    <label class="opt"><input type="checkbox" id="remove_zero"> Remove 0 qty</label>

    <div id="outputs"></div>

    <section id="all" class="all">
      <h2>Download all</h2>
      <div class="all-row">
        <label><input type="checkbox" id="all_csv"> Simple CSV <span class="muted" id="all_csv_n"></span></label>
        <label><input type="checkbox" id="all_xlsx"> Detailed XLSX <span class="muted" id="all_xlsx_n"></span></label>
        <button type="button" id="all_select" class="small">Select all</button>
      </div>
      <button type="button" id="all_download" class="small" disabled>Download</button>
    </section>
    <p class="muted small">Everything happens in this browser. Nothing is sent anywhere.</p>
  </section>
</main>
<script src="../vendor/core.js"></script>
<script src="scrape-core.js"></script>
<script src="status.js"></script>
<script src="detect.js"></script>
<script src="review.js"></script>
<script src="engine.js"></script>
<script src="panel.js"></script>
</body>
</html>
